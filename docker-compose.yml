# Local development only: PostgreSQL + Mailpit (SMTP catcher, UI on http://localhost:8025).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voltix
      POSTGRES_PASSWORD: voltix_dev
      POSTGRES_DB: voltix
    ports:
      - "5433:5432"
    volumes:
      - voltix_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltix"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  voltix_pg:
