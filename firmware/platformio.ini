; Voltix ESP32 firmware. Build: `pio run`, flash: `pio run -t upload`, serial: `pio device monitor`.
; Portable protocol tests run without PlatformIO: `npm run test:firmware` from the repo root.

[platformio]
default_envs = voltix-4l2f

[env]
platform = espressif32@^6.9.0
framework = arduino
board = esp32dev
monitor_speed = 115200
; Two OTA slots so a new image can be installed beside the running one and rolled back.
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    links2004/WebSockets@^2.6.1
    tzapu/WiFiManager@^2.0.17
build_flags =
    -DCORE_DEBUG_LEVEL=1

; The stock Voltix controller: 4 lights + 2 fans (include/board_config.h).
; The model name is what OTA rollouts target, so only bump FIRMWARE_VERSION for a release.
[env:voltix-4l2f]
build_flags =
    ${env.build_flags}
    -DVOLTIX_MODEL=\"voltix-4l2f\"
    -DVOLTIX_FIRMWARE_VERSION=\"1.0.0\"
